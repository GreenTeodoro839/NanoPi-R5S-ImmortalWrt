name: Build ImmortalWrt for NanoPi R5S

on:
  workflow_dispatch:
  push:
    paths:
      - 'configs/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  CONFIG_FILE: configs/r5s.config
  DIY_P1_SH: scripts/diy-part1.sh
  DIY_P2_SH: scripts/diy-part2.sh
  WORKDIR: /mnt/workdir
  TZ: Asia/Shanghai
  # rules.mk:346 把 CCACHE_DIR 定死在 $(TOPDIR)/.ccache，这里只管容量和校验方式。
  # compilercheck=content：工具链是从缓存里解出来的，mtime 每次都变，用内容校验才有命中率。
  CCACHE_MAXSIZE: 3G
  CCACHE_COMPILERCHECK: content

permissions:
  contents: read
  actions: write      # 清理旧缓存条目要写 actions

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free up disk space
      run: |
        echo "=== 清理前 ==="
        df -hT / /mnt
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /usr/local/share/boost /usr/local/share/powershell \
                    /usr/share/swift /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" || true
        sudo docker image prune --all --force || true
        sudo apt-get -qq purge -y azure-cli google-chrome-stable firefox \
                    powershell mono-devel libgl1-mesa-dri temurin-* || true
        sudo apt-get -qq autoremove -y || true
        sudo apt-get -qq clean
        echo "=== 清理后 ==="
        df -hT / /mnt

    - name: Install build dependencies
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install -y \
          build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3 python3-dev python3-setuptools python3-pip python3-pyelftools \
          rsync swig unzip zlib1g-dev \
          file wget subversion patch pkgconf zstd ccache \
          gperf libtool libltdl-dev intltool libxml-parser-perl \
          gnutls-bin libgnutls28-dev p7zip-full ninja-build
        sudo timedatectl set-timezone "$TZ"

    - name: Prepare workdir
      run: |
        sudo mkdir -p $WORKDIR
        sudo chown -R $USER:$USER $WORKDIR

    - name: Clone ImmortalWrt source
      run: |
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL $WORKDIR/openwrt
        cd $WORKDIR/openwrt
        echo "SOURCE_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        echo "KERNEL=$(grep -m1 KERNEL_PATCHVER target/linux/rockchip/Makefile)" >> $GITHUB_ENV

    - name: Run diy-part1 (third-party packages)
      run: |
        cd $WORKDIR/openwrt
        bash $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update & install feeds
      run: |
        cd $WORKDIR/openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load config & run diy-part2
      run: |
        cd $WORKDIR/openwrt
        cp $GITHUB_WORKSPACE/$CONFIG_FILE .config
        bash $GITHUB_WORKSPACE/$DIY_P2_SH
        make defconfig

    - name: Verify resolved config
      run: |
        cd $WORKDIR/openwrt
        fail=0
        echo "### 必须存在（缺失即失败） ###"
        for s in \
          CONFIG_TARGET_rockchip=y \
          CONFIG_TARGET_rockchip_armv8=y \
          CONFIG_TARGET_ROOTFS_SQUASHFS=y \
          CONFIG_TARGET_ROOTFS_PARTSIZE=2048 \
          CONFIG_ALL_KMODS=y \
          CONFIG_PACKAGE_dockerd=y \
          CONFIG_PACKAGE_luci-app-dockerman=y \
          CONFIG_PACKAGE_luci-app-passwall=y \
          CONFIG_PACKAGE_luci-app-store=y \
          CONFIG_PACKAGE_luci-app-nikki=y \
          CONFIG_PACKAGE_luci-app-mosdns=y \
          CONFIG_DEVEL=y \
          CONFIG_CCACHE=y ; do
          if grep -qx "$s" .config; then echo "  OK   $s"; else echo "  MISS $s"; fail=1; fi
        done
        echo "### 设备 profile（两种写法任一即可） ###"
        if grep -qx 'CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r5s=y' .config; then
          echo "  OK   multi-profile 形式"
        elif grep -qx 'CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-r5s=y' .config; then
          echo "  OK   single-profile 形式"
        else
          echo "  MISS 两种形式都没有 —— 设备没选上"
          grep -E '^CONFIG_TARGET_(PROFILE|MULTI_PROFILE)|nanopi-r5s' .config || true
          fail=1
        fi
        echo "### 可选（缺失只告警） ###"
        for s in \
          CONFIG_PACKAGE_luci-app-openclash=y \
          CONFIG_PACKAGE_luci-app-homeproxy=y \
          CONFIG_PACKAGE_luci-app-qbittorrent=y \
          CONFIG_PACKAGE_luci-app-filebrowser=y \
          CONFIG_PACKAGE_luci-app-diskman=y \
          CONFIG_PACKAGE_luci-app-samba4=y \
          CONFIG_PACKAGE_luci-theme-argon=y \
          CONFIG_PACKAGE_mihomo-meta=y \
          CONFIG_PACKAGE_htop=y \
          CONFIG_PACKAGE_ethtool=y \
          CONFIG_PACKAGE_lsblk=y \
          CONFIG_PACKAGE_kmod-fs-ntfs3=y \
          CONFIG_PACKAGE_kmod-nvme=y \
          CONFIG_PACKAGE_mosdns=y \
          CONFIG_PACKAGE_geo2txt=y \
          CONFIG_PACKAGE_luci-app-adguardhome=y \
          CONFIG_PACKAGE_adguardhome=y \
          CONFIG_PACKAGE_luci-app-argon-config=y \
          CONFIG_PACKAGE_luci-app-zerotier=y \
          CONFIG_PACKAGE_luci-app-frpc=y \
          CONFIG_PACKAGE_luci-app-aria2=y \
          CONFIG_PACKAGE_luci-app-nlbwmon=y \
          CONFIG_PACKAGE_luci-app-watchcat=y \
          CONFIG_PACKAGE_luci-app-commands=y \
          CONFIG_PACKAGE_luci-app-advanced-reboot=y \
          CONFIG_PACKAGE_luci-app-eqos=y ; do
          if grep -qx "$s" .config; then echo "  OK   $s"; else echo "  WARN $s (被 defconfig 丢弃)"; fi
        done
        echo "kmod 模块总数: $(grep -c '^CONFIG_PACKAGE_kmod-.*=m$' .config)"
        [ $fail -eq 0 ] || { echo "关键配置缺失，中止"; exit 1; }

    - name: Compute cache keys
      id: ck
      run: |
        cd $WORKDIR/openwrt
        # 工具链缓存里全是绝对路径（libtool .la / pkg-config .pc / 各种 wrapper 脚本），
        # WORKDIR 一变就全废，所以把它拌进 key。
        # 只取和工具链相关的 .config 行：改个软件包选择不该让 35 分钟的工具链作废。
        TC=$( { echo "$WORKDIR"
                find tools toolchain include -type f -print0 | sort -z | xargs -0 sha256sum
                grep -E '^CONFIG_(ARCH|CPU_TYPE|TARGET_(rockchip|ARCH_PACKAGES|SUFFIX|OPTIMIZATION)|GCC_|BINUTILS_|LIBC|USE_(MUSL|GLIBC)|TOOLCHAIN_|CCACHE|DEVEL)' .config
              } | sha256sum | cut -c1-16 )
        echo "toolchain=$TC" >> $GITHUB_OUTPUT
        echo "工具链 key: $TC"

    - name: Restore toolchain cache
      id: tc-cache
      uses: actions/cache/restore@v4
      with:
        # 只吃精确命中。半匹配的工具链比没有更危险，宁可重编 35 分钟。
        key: toolchain-${{ steps.ck.outputs.toolchain }}
        path: |
          /mnt/workdir/openwrt/staging_dir/host
          /mnt/workdir/openwrt/staging_dir/toolchain-*
          /mnt/workdir/openwrt/build_dir/host
          /mnt/workdir/openwrt/build_dir/toolchain-*

    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        key: ccache-${{ github.run_id }}
        restore-keys: ccache-
        path: /mnt/workdir/openwrt/.ccache

    - name: Restore Go caches
      uses: actions/cache/restore@v4
      with:
        # GOCACHE（编译产物）+ GOMODCACHE（模块源码，golang-values.mk:258 定在 dl/ 里）。
        # ccache 对 Go 完全无效，代理那几个大件全靠这个。
        key: gocache-${{ github.run_id }}
        restore-keys: gocache-
        path: |
          /mnt/workdir/openwrt/.go-build-cache
          /mnt/workdir/openwrt/dl/go-mod-cache

    - name: Reset ccache stats
      run: |
        cd $WORKDIR/openwrt
        CCACHE_DIR=$PWD/.ccache ccache -z >/dev/null 2>&1 || true
        echo "工具链缓存命中: ${{ steps.tc-cache.outputs.cache-hit || 'false' }}"

    - name: Check package prerequisites
      run: |
        cd $WORKDIR/openwrt
        # u-boot / 内核等包会在这里检查 host 侧依赖（pyelftools 等）。
        # 放在 download 之前，缺依赖 1 分钟就能暴露，不用等下载跑完。
        make prereq

    - name: Download sources
      run: |
        cd $WORKDIR/openwrt
        make download -j8 || make download -j1 V=s
        # 只清 dl/ 顶层的残缺下载。不能递归：dl/go-mod-cache 里全是 .mod/.info
        # 这类几百字节的小文件，递归删会把刚恢复的 Go 模块缓存清空。
        find dl -maxdepth 1 -type f -size -1024c -delete || true

    - name: Compile tools & toolchain
      run: |
        cd $WORKDIR/openwrt
        make tools/compile -j$(nproc) || make tools/compile -j1 V=s
        make toolchain/compile -j$(nproc) || make toolchain/compile -j1 V=s

    - name: Compile kernel
      run: |
        cd $WORKDIR/openwrt
        make target/compile -j$(nproc) || make target/compile -j1 V=s

    - name: Compile packages (all kmods + userspace)
      run: |
        cd $WORKDIR/openwrt
        make package/compile -j$(nproc) IGNORE_ERRORS=1
        df -hT /mnt

    - name: Cache stats
      if: always()
      run: |
        cd $WORKDIR/openwrt
        echo "=== ccache ==="
        CCACHE_DIR=$PWD/.ccache ccache -s 2>/dev/null || echo "ccache 没启用？"
        echo "=== 各缓存目录体积（未压缩） ==="
        du -sh .ccache .go-build-cache dl/go-mod-cache \
               staging_dir/host build_dir/host \
               staging_dir/toolchain-* build_dir/toolchain-* 2>/dev/null || true

    - name: Save toolchain cache
      if: always() && steps.tc-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        key: toolchain-${{ steps.ck.outputs.toolchain }}
        path: |
          /mnt/workdir/openwrt/staging_dir/host
          /mnt/workdir/openwrt/staging_dir/toolchain-*
          /mnt/workdir/openwrt/build_dir/host
          /mnt/workdir/openwrt/build_dir/toolchain-*

    - name: Save ccache
      if: always()
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        key: ccache-${{ github.run_id }}
        path: /mnt/workdir/openwrt/.ccache

    - name: Save Go caches
      if: always()
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        key: gocache-${{ github.run_id }}
        path: |
          /mnt/workdir/openwrt/.go-build-cache
          /mnt/workdir/openwrt/dl/go-mod-cache

    - name: Prune old caches
      if: always()
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # 仓库总配额 10 GB，超了 GitHub 按 LRU 自己删，会把三份缓存互相踢掉。
        # 每个前缀只留最新一份。
        for p in ccache- gocache- toolchain-; do
          gh cache list --repo "$GITHUB_REPOSITORY" --key "$p" --limit 100 \
             --json id,createdAt --jq 'sort_by(.createdAt)|reverse|.[1:]|.[].id' |
          while read -r id; do
            [ -n "$id" ] && gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
          done
        done
        echo "=== 保留的缓存 ==="
        gh cache list --repo "$GITHUB_REPOSITORY" --limit 20

    - name: Generate package index
      run: |
        cd $WORKDIR/openwrt
        make package/index
        echo "=== 索引产物 ==="
        ls -la bin/targets/rockchip/armv8/packages/ | head -5
        echo "kmod ipk 数量: $(ls bin/targets/rockchip/armv8/packages/kmod-*.ipk 2>/dev/null | wc -l)"
        du -sh bin/targets/rockchip/armv8/packages/

    - name: Embed local kmod feed into rootfs
      run: |
        cd $WORKDIR/openwrt
        mkdir -p files/usr/lib/opkg/kmods
        cp -r bin/targets/rockchip/armv8/packages/. files/usr/lib/opkg/kmods/
        mkdir -p files/etc/opkg
        echo 'src/gz local_kmods file:///usr/lib/opkg/kmods' > files/etc/opkg/customfeeds.conf
        echo "=== 内置源体积 ==="
        du -sh files/usr/lib/opkg/kmods

    - name: Build rootfs & image
      run: |
        cd $WORKDIR/openwrt
        make package/install -j$(nproc) || make package/install -j1 V=s
        make target/install -j$(nproc) || make target/install -j1 V=s
        make checksum

    - name: Verify rootfs fits in partition
      run: |
        cd $WORKDIR/openwrt
        # gen_image_generic.sh 写 rootfs 时没有 count= 限制，squashfs 超出
        # ROOTFS_PARTSIZE 会静默越界，到刷机时被 dd 的 count= 截断才炸。
        # rockchip 的 Device/Default 没有 check-size，所以这里自己拦。
        PARTSIZE=$(sed -n 's/^CONFIG_TARGET_ROOTFS_PARTSIZE=//p' .config)
        SQ=$(find build_dir -name 'root.squashfs' -type f 2>/dev/null | head -1)
        if [ -z "$SQ" ]; then
          echo "未找到 root.squashfs（可能是 ext4 构建），跳过检查"
          exit 0
        fi
        SZ=$(stat -c%s "$SQ")
        LIMIT=$((PARTSIZE * 1024 * 1024))
        PCT=$((SZ * 100 / LIMIT))
        echo "root.squashfs : $((SZ/1048576)) MiB"
        echo "分区上限      : ${PARTSIZE} MiB"
        echo "占用          : ${PCT}%"
        echo "留给 overlay  : $(((LIMIT - SZ)/1048576)) MiB"
        if [ "$SZ" -ge "$LIMIT" ]; then
          echo "::error::squashfs ($((SZ/1048576)) MiB) 超过 ROOTFS_PARTSIZE (${PARTSIZE} MiB)，镜像会静默损坏"
          exit 1
        fi
        if [ "$PCT" -ge 80 ]; then
          echo "::warning::squashfs 已占分区 ${PCT}%，留给 overlay 的空间不多了"
        fi

    - name: Collect firmware
      run: |
        cd $WORKDIR/openwrt/bin/targets/rockchip/armv8
        rm -rf packages
        echo "=== 产物 ==="
        ls -lh
        echo "FIRMWARE_DIR=$PWD" >> $GITHUB_ENV
        echo "BUILD_DATE=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: immortalwrt-nanopi-r5s-${{ env.BUILD_DATE }}
        path: |
          ${{ env.FIRMWARE_DIR }}/*.img.gz
          ${{ env.FIRMWARE_DIR }}/*.manifest
          ${{ env.FIRMWARE_DIR }}/sha256sums
        if-no-files-found: error

    - name: Upload .config
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: config-${{ github.run_number }}
        path: /mnt/workdir/openwrt/.config
        include-hidden-files: true
        if-no-files-found: warn

    - name: Collect logs on failure
      if: failure()
      run: |
        cd $WORKDIR/openwrt
        mkdir -p /tmp/faillogs
        cp -r logs /tmp/faillogs/ 2>/dev/null || true
        cp .config /tmp/faillogs/config.txt 2>/dev/null || true
        df -hT / /mnt > /tmp/faillogs/df.txt
        find /tmp/faillogs -name '*.txt' | head -50

    - name: Upload failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: faillogs-${{ github.run_number }}
        path: /tmp/faillogs
        include-hidden-files: true
        if-no-files-found: warn
